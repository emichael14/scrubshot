name: CLA Assistant

# Asks first-time contributors to accept docs/CLA.md with a pull request comment and records the acceptance in
# signatures/version1/cla.json on the cla-signatures branch of this repository (docs/decisions.md D-018, D-047).
# Nothing leaves GitHub: the action only uses the repository's own GITHUB_TOKEN.
#
# pull_request_target runs in the context of this repository, with a token that can write. That is safe here
# because the job never checks out or executes code from the pull request; it only reads commit authors
# and comments through the API. Do not add a checkout step to this workflow.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write        # commits the signature file to the cla-signatures branch
  pull-requests: write   # comments on the pull request, locks it after merge
  statuses: write        # sets the CLA status check

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA acceptance
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # contributor-assistant/github-action v2.6.1, pinned by commit.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/emichael14/scrubshot/blob/main/docs/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          # The branch must exist and must not be protected. It is separate from main so the bot never commits there.
          branch: 'cla-signatures'
          # The project owner and automation accounts do not sign.
          allowlist: 'emichael14,dependabot[bot],github-actions[bot]'
          custom-notsigned-prcomment: 'Thank you for the contribution. Before it can be reviewed, please read the [ScrubShot Contributor License Agreement](https://github.com/emichael14/scrubshot/blob/main/docs/CLA.md) and accept it by posting the comment below. You keep the copyright in your work.'
          custom-allsigned-prcomment: 'All contributors to this pull request have accepted the CLA.'
